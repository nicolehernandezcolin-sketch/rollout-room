<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --ground:#E9ECF1; --surface:#FFFFFF; --sunk:#DEE2E9; --ink:#14161B; --ink-2:#585E6B; --line:#CBD0D9;
  --accent:#2B44F0; --accent-ink:#FFFFFF; --accent-soft:#DDE2FF;
  --warn:#B93C0B; --warn-soft:#FBE4D6; --ok:#13773A; --ok-soft:#D8F0E0;
  --c-ig:#2a78d6; --c-tt:#eb6834; --c-yt:#1baf7a; --c-th:#eda100; --c-x:#e87ba4; --c-fb:#008300;
  --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#184f95;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1014; --surface:#171A20; --sunk:#20242C; --ink:#E8EBF1; --ink-2:#9BA2AF; --line:#2D323C;
    --accent:#8296FF; --accent-ink:#0B0D12; --accent-soft:#222A52;
    --warn:#FB9A5C; --warn-soft:#3A2416; --ok:#5BDB8A; --ok-soft:#14301F;
    --c-ig:#3987e5; --c-tt:#d95926; --c-yt:#199e70; --c-th:#c98500; --c-x:#d55181; --c-fb:#008300;
    --seq-1:#1c2533; --seq-2:#104281; --seq-3:#184f95; --seq-4:#256abf; --seq-5:#3987e5; --seq-6:#86b6ef;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1014; --surface:#171A20; --sunk:#20242C; --ink:#E8EBF1; --ink-2:#9BA2AF; --line:#2D323C;
  --accent:#8296FF; --accent-ink:#0B0D12; --accent-soft:#222A52;
  --warn:#FB9A5C; --warn-soft:#3A2416; --ok:#5BDB8A; --ok-soft:#14301F;
  --c-ig:#3987e5; --c-tt:#d95926; --c-yt:#199e70; --c-th:#c98500; --c-x:#d55181; --c-fb:#008300;
  --seq-1:#1c2533; --seq-2:#104281; --seq-3:#184f95; --seq-4:#256abf; --seq-5:#3987e5; --seq-6:#86b6ef;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding:0 16px 72px}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:20px 12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.logo svg{flex:none}
.who{display:flex;align-items:center;gap:10px;font-size:.85rem}
.demo-tag{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:3px 8px;border-radius:5px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;gap:4px;overflow-x:auto;padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:22px;scrollbar-width:none}
nav button{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--ink-2);white-space:nowrap}
nav button[aria-current="true"]{background:var(--ink);color:var(--ground)}
nav .count{font-family:var(--mono);font-size:.72rem;margin-left:6px;opacity:.75}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:860px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
@media (max-width:420px){.grid4{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.88rem;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.lg{padding:12px 20px;font-size:1rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.8rem}
label.field{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.85rem}
label.field .hint,.hint{font-weight:400;color:var(--ink-2);font-size:.8rem}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;font-weight:400}
input[type=range]{width:100%;accent-color:var(--accent)}
textarea{resize:vertical;min-height:84px;line-height:1.5}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:12px 16px}
.banner.warn{background:var(--warn-soft)}
.empty{padding:28px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--r)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill.approved,.pill.scheduled{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.published{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pill.late{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.plat{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem}

/* landing */
.land{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding-block:40px 30px}
.land h1{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:800;letter-spacing:-.035em;line-height:1}
.land .lede{font-size:1.1rem;color:var(--ink-2);max-width:34ch;margin-top:16px}
.land .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.loop{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.loop div{padding:14px 18px;display:grid;grid-template-columns:120px 1fr;gap:12px;border-top:1px solid var(--line)}
.loop div:first-child{border-top:0}
.loop b{font-family:var(--display)}
@media (max-width:760px){.land{grid-template-columns:1fr;gap:28px;padding-block:24px}}
.steps{display:flex;gap:6px;margin-bottom:6px}
.steps i{height:4px;flex:1;border-radius:2px;background:var(--sunk)}
.steps i.on{background:var(--accent)}
.wizard{max-width:720px;margin:20px auto 0}

/* kpis */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:1.7rem;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .d{font-size:.8rem;font-family:var(--mono)}
.up{color:var(--ok)} .down{color:var(--warn)}
.goalbar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.goalbar div{height:14px;border-radius:3px;background:var(--sunk);position:relative;overflow:hidden}
.goalbar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.pcard .big{font-family:var(--display);font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.84rem}
.kv span:nth-child(even){font-family:var(--mono);text-align:right}
.insight{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.insight b{font-family:var(--display);font-size:1.02rem;font-weight:700;line-height:1.3}
.insight .src{font-size:.75rem;color:var(--ink-2);font-family:var(--mono)}

/* charts */
.chart-wrap{position:relative}
.chart{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--ground);padding:8px 10px;border-radius:6px;font-size:.78rem;line-height:1.45;white-space:nowrap;z-index:3;transform:translate(-50%,-100%)}
.tip .mono{font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.heat{display:grid;grid-template-columns:72px repeat(7,minmax(0,1fr));gap:3px;font-size:.75rem}
.heat .c{height:30px;border-radius:4px}
.heat .h{color:var(--ink-2);display:flex;align-items:center}
.heat .dh{color:var(--ink-2);text-align:center}
.hbar{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:8px 10px;align-items:center;font-size:.85rem}
.hbar .t{height:14px;background:var(--sunk);border-radius:0 4px 4px 0}
.hbar .t i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--seq-4)}
.hbar .t i.rec{background:var(--accent)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
td.num,th.num{text-align:right;font-family:var(--mono)}

/* queue */
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.post .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem}
.post .cap{white-space:pre-wrap;font-size:.92rem}
.post .cap.none{color:var(--ink-2);font-style:italic}
.post .tags{font-family:var(--mono);font-size:.78rem;color:var(--accent);word-break:break-word}
.route{font-size:.8rem;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.actions{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.composer{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
@media (max-width:860px){.composer{grid-template-columns:1fr}}
.sugg{background:var(--ground);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sugg .h{font-weight:700}
.sugg .c{white-space:pre-wrap;font-size:.88rem}
.daygroup{display:flex;flex-direction:column;gap:10px}
.daygroup + .daygroup{margin-top:18px}
.vitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}

/* plan */
.strat section{display:flex;flex-direction:column;gap:10px}
.strat section + section{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.strat ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.rw{display:grid;grid-template-columns:160px 1fr;gap:14px;padding:12px;background:var(--ground);border-radius:8px}
@media (max-width:560px){.rw{grid-template-columns:1fr}}

/* kit */
.kit{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:22px}
.kit h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;letter-spacing:-.03em}
.kit .stamp{align-self:flex-start;border:2px solid var(--warn);color:var(--warn);font-weight:800;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:4px}
.kit .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kit .stats div{background:var(--surface);padding:14px}
.kit .stats b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
@media (max-width:640px){.kit .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.kit{padding:18px}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-weight:600;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
.working{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:.88rem}
.working::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--accent);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.25;transform:translateY(2px)}to{opacity:1;transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.working::before{animation:none}}
.conn{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.conn:first-child{border-top:0}
.count-ok{color:var(--ink-2)} .count-over{color:var(--warn);font-weight:600}
.signin{max-width:460px;margin:40px auto 0}
details summary{cursor:pointer;font-weight:600}
</style>

<div class="wrap">
  <header class="top">
    <div class="logo"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="12" width="22" height="10" rx="3" fill="var(--sunk)"/><rect x="2" y="8" width="22" height="8" rx="3" fill="var(--seq-3)"/><rect x="2" y="4" width="22" height="6" rx="3" fill="var(--accent)"/></svg>Rollout Room</div>
    <div class="who" id="who"></div>
  </header>
  <div id="app"></div>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="imgPick" accept="image/*" hidden>

<script>
(() => {
const ARTIFACT_URL = "https://claude.ai/artifact/YJRGmuGC9gUqZkH4aEmU3E";
const PLATFORMS = {
  ig:{name:"Instagram", api:"Instagram API with Instagram Login", route:"Publishes to Instagram at the scheduled time"},
  tt:{name:"TikTok", api:"TikTok Content Posting API + Display API", route:"Lands in your TikTok inbox as a draft — add the sound and post in the app"},
  yt:{name:"YouTube Shorts", api:"YouTube Data API + YouTube Analytics API", route:"Uploads as a Short at the scheduled time"},
  th:{name:"Threads", api:"Threads API", route:"Publishes to Threads at the scheduled time"},
  x:{name:"X", api:"X API v2 (needs an X developer account; check X's current API pricing)", route:"Posts to X at the scheduled time; a thread posts as a chain of replies"},
  fb:{name:"Facebook", api:"Facebook Pages API", route:"Publishes to your Facebook Page at the scheduled time"}
};
const PKEYS = Object.keys(PLATFORMS);
const FORMATS = {ig:["Reel","Carousel","Photo"], tt:["Video","Photo carousel"], yt:["Short"], th:["Text","Photo"], x:["Text","Image","Video","Thread"], fb:["Reel","Photo"]};
const CREATOR_TYPES = ["Musician","Visual artist","Dancer","Filmmaker","Designer","Photographer","Comedian","Other"];
const WHY = ["Brand partnerships","Venue bookings","Sponsorships","Launch a project","Grow a community"];
const ENJOY = ["Short video","Photos","Carousels","Behind the scenes","Talking to camera","Performance clips","Writing"];
const TABS = [{k:"dash",name:"Dashboard"},{k:"analytics",name:"Analytics"},{k:"plan",name:"Plan"},{k:"queue",name:"Queue"},{k:"vault",name:"Vault"},{k:"kit",name:"Media kit"},{k:"settings",name:"Settings"}];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const BLOCKS = [{n:"Morning",a:6,b:11},{n:"Midday",a:11,b:15},{n:"Afternoon",a:15,b:18},{n:"Evening",a:18,b:22},{n:"Late",a:22,b:26}];
const LS = "rollout-room-v2";
const CFG = window.ROLLOUT_CONFIG || {};
const MODE = window.claude?.use ? "claude" : (CFG.supabaseUrl && CFG.supabaseKey && window.supabase ? "supabase" : "local");
const kitLink = code => (MODE === "claude" ? ARTIFACT_URL : location.origin + location.pathname) + "#kit-" + code;
const LIMITS = {x:280, th:500};
function captionParts(x){ return x.format === "Thread" ? String(x.caption||"").split(/\n\s*-{3,}\s*\n/) : [String(x.caption||"")]; }
function overLimit(x){ const lim = LIMITS[x.platform]; if(!lim) return false; const tags = (x.hashtags||[]).join(" "); const parts = captionParts(x);
  return parts.some((t,i) => (t.length + (i===parts.length-1 && tags ? tags.length+2 : 0)) > lim); }
function countHtml(platform, format, caption, hashtags){
  const lim = LIMITS[platform]; if(!lim) return "";
  const x = {platform, format, caption, hashtags}; const parts = captionParts(x); const tags = (hashtags||[]).join(" ");
  return parts.map((t,i) => { const n = t.length + (i===parts.length-1 && tags ? tags.length+2 : 0); return `<span class="${n>lim?"count-over":"count-ok"}">${parts.length>1?`Post ${i+1}: `:""}${n}/${lim}${n>lim?" — too long":""}</span>`; }).join(" · ");
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => ymd(new Date());
const fmtDay = s => parseYmd(s).toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
const fmtN = n => Math.round(Number(n)||0).toLocaleString();
const fmtK = n => { n = Number(n)||0; return n >= 1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,"")+"M" : n >= 1e4 ? Math.round(n/1e3)+"K" : n >= 1e3 ? (n/1e3).toFixed(1).replace(/\.0$/,"")+"K" : String(Math.round(n)); };
const pct = (n,d=1) => (n*100).toFixed(d)+"%";
const sgn = n => (n>=0?"+":"−")+fmtN(Math.abs(n));
const rid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
const sum = a => a.reduce((x,y)=>x+y,0);
const avg = a => a.length ? sum(a)/a.length : 0;
const pcolor = k => `var(--c-${k})`;
const dot = k => `<span class="dot" style="background:${pcolor(k)}"></span>`;
const pname = k => PLATFORMS[k]?.name || k;

/* ================= sample data generator ================= */
function hash(s){ let h = 2166136261; for(const c of String(s)){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h>>>0; }
function rng(seed){ let a = seed>>>0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
const PCONF = {
  ig:{start:3200, reach:850, fmt:{Reel:1.7,Carousel:1.0,Photo:.6}, fol:{Reel:1.15,Carousel:1.0,Photo:.6}, shr:{Reel:.013,Carousel:.008,Photo:.003}, sav:{Reel:.011,Carousel:.027,Photo:.006}, eng:.065},
  tt:{start:1800, reach:2100, fmt:{Video:1.0,"Photo carousel":.55}, fol:{Video:1.0,"Photo carousel":.7}, shr:{Video:.011,"Photo carousel":.006}, sav:{Video:.007,"Photo carousel":.012}, eng:.075},
  yt:{start:420, reach:1300, fmt:{Short:1}, fol:{Short:.55}, shr:{Short:.004}, sav:{Short:.002}, eng:.04},
  th:{start:650, reach:320, fmt:{Text:1,Photo:1.25}, fol:{Text:.8,Photo:1}, shr:{Text:.01,Photo:.006}, sav:{Text:.002,Photo:.003}, eng:.05},
  x:{start:380, reach:260, fmt:{Text:1,Image:1.2,Video:1.4,Thread:1.3}, fol:{Text:.6,Image:.7,Video:.8,Thread:1.0}, shr:{Text:.012,Image:.01,Video:.009,Thread:.015}, sav:{Text:.002,Image:.003,Video:.003,Thread:.009}, eng:.03},
  fb:{start:520, reach:220, fmt:{Reel:1.4,Photo:.8}, fol:{Reel:.6,Photo:.4}, shr:{Reel:.01,Photo:.006}, sav:{Reel:.004,Photo:.003}, eng:.04}
};
const CITIES = ["Los Angeles","New York","Atlanta","Chicago","Houston","London","Toronto","Mexico City","Miami","Dallas","Philadelphia","São Paulo","Lagos","Berlin"];
const DAYS = 120;
const genCache = new Map();
function genPlatform(k, seedStr){
  const key = k+"|"+seedStr+"|"+today(); if(genCache.has(key)) return genCache.get(key);
  const R = rng(hash(key)); const c = PCONF[k];
  const gauss = () => { let u = 0, v = 0; while(!u) u = R(); while(!v) v = R(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const scale = .65 + R()*.8;
  const end = new Date(); const start = addDays(end, -(DAYS-1));
  const weeks = Math.ceil(DAYS/7); const pattern = [2,3,5,7,1,4,6,3,2,5,4,3,6,2,4,3,5,4];
  for(let i=pattern.length-1;i>0;i--){ const j = Math.floor(R()*(i+1)); [pattern[i],pattern[j]] = [pattern[j],pattern[i]]; }
  const perWeek = Array.from({length:weeks}, (_,w) => Math.max(1, pattern[w % pattern.length] - (k==="yt"||k==="fb"||k==="x" ? 1 : 0)));
  const fmts = FORMATS[k]; const posts = [];
  const hourMult = h => h>=18&&h<22 ? 1.3 : h>=11&&h<15 ? 1.0 : h>=15&&h<18 ? 1.08 : h>=22 ? .9 : .72;
  const dowMult = [1.15,.9,.95,1,1.12,1.05,.94];
  let followers = c.start*scale*.72; const daily = []; const gainsByDay = new Array(DAYS).fill(0);
  for(let w=0; w<weeks; w++){
    const n = perWeek[w]; const days = new Set(); while(days.size < Math.min(n,7)) days.add(Math.floor(R()*7));
    const fatigue = n <= 3 ? 1 : 1/(1+.2*(n-3));
    for(const dd of days){
      const di = w*7+dd; if(di >= DAYS) continue;
      const date = addDays(start, di); const dow = date.getDay();
      const hRoll = R(); const hour = hRoll < .45 ? 18+Math.floor(R()*4) : hRoll < .7 ? 11+Math.floor(R()*4) : hRoll < .85 ? 15+Math.floor(R()*3) : hRoll < .93 ? 8+Math.floor(R()*3) : 22+Math.floor(R()*2);
      const fmt = fmts[Math.floor(R()*fmts.length)];
      const growthF = Math.sqrt(1 + di/DAYS*.35);
      let reach = c.reach*scale*growthF*c.fmt[fmt]*hourMult(hour)*dowMult[dow]*fatigue*Math.exp(gauss()*.45);
      const viral = R() < .035; if(viral) reach *= 3.5 + R()*4;
      reach = Math.round(reach);
      const likes = Math.round(reach*c.eng*(.8+R()*.4)); const comments = Math.round(reach*c.eng*.08*(.6+R()*.8));
      const shares = Math.round(reach*c.shr[fmt]*(.6+R()*.8)); const saves = Math.round(reach*c.sav[fmt]*(.6+R()*.8));
      const follows = Math.round(reach*.0062*c.fol[fmt]*(.7+R()*.6));
      posts.push({id:`${k}${di}${dd}`, platform:k, date:ymd(date), hour, dow, format:fmt, reach, likes, comments, shares, saves, follows, viral, perWeek:n});
      gainsByDay[di] += follows*.6; if(di+1<DAYS) gainsByDay[di+1] += follows*.3; if(di+2<DAYS) gainsByDay[di+2] += follows*.1;
    }
  }
  for(let d=0; d<DAYS; d++){ followers += gainsByDay[d] + (R()*4-1.2)*scale - followers*.00035; daily.push({date:ymd(addDays(start,d)), v:Math.round(followers)}); }
  const ageBase = {ig:[4,34,38,15,9], tt:[11,43,30,10,6], yt:[8,36,32,14,10], th:[2,30,42,17,9], x:[2,28,40,18,12], fb:[1,14,32,26,27]}[k];
  const ages = ageBase.map(v => v*(.85+R()*.3)); const at = sum(ages);
  const cities = CITIES.slice().sort(() => R()-.5).slice(0,5); let rem = 34 + R()*12;
  const cityShares = cities.map((n,i) => { const s = i===4 ? rem : rem*(.32+R()*.15); rem -= i===4 ? 0 : s; return {name:n, share:s/100}; });
  const women = .45 + R()*.2;
  const out = {source:"demo", posts, daily, perWeek, audience:{ages:["13–17","18–24","25–34","35–44","45+"].map((n,i)=>({name:n, share:ages[i]/at})), gender:{women, men:1-women-.03, other:.03}, cities:cityShares}};
  genCache.set(key, out); return out;
}

/* ================= metrics ================= */
function connected(){ const p = profile(); if(!p) return []; return (p.platforms||[]).filter(k => (p.connections||{})[k] && (p.connections||{})[k] !== "off"); }
function dataFor(k){
  const p = profile(); const mode = p?.connections?.[k];
  if(mode === "demo") return genPlatform(k, (p.handles?.[k] || p.name || "x") + (S.sampleMode ? "sample" : ""));
  const ci = checkins(k).map(g => ({date:g.date, v:Number(g.followers)}));
  return {source: ci.length ? "manual" : "none", posts:[], daily:ci, perWeek:[], audience:null};
}
function valueOn(daily, date){ let v = null; for(const r of daily){ if(r.date <= date) v = r.v; else break; } return v; }
function stats(k, days=30){
  const d = dataFor(k); const end = today(); const from = ymd(addDays(new Date(), -days)); const from2 = ymd(addDays(new Date(), -days*2));
  const cur = d.daily.length ? d.daily[d.daily.length-1].v : 0;
  const then = valueOn(d.daily, from); const then2 = valueOn(d.daily, from2);
  const recent = d.posts.filter(x => x.date > from); const prior = d.posts.filter(x => x.date > from2 && x.date <= from);
  const er = list => { const r = sum(list.map(x=>x.reach)); return r ? sum(list.map(x=>x.likes+x.comments+x.shares+x.saves))/r : 0; };
  return { k, source:d.source, followers:cur, gain: then!=null ? cur-then : null, gainPrev: then!=null && then2!=null ? then-then2 : null,
    posts:recent.length, reach:sum(recent.map(x=>x.reach)), reachPrev:sum(prior.map(x=>x.reach)), er:er(recent), erPrev:er(prior),
    perPost: recent.length && then!=null ? (cur-then)/recent.length : null, data:d };
}
function combinedDaily(){
  const ks = connected(); if(!ks.length) return [];
  const all = ks.map(k => dataFor(k).daily).filter(x => x.length);
  if(!all.length) return [];
  const dates = [...new Set(all.flatMap(s => s.map(r=>r.date)))].sort();
  return dates.map(date => ({date, v: sum(all.map(s => valueOn(s, date) ?? 0))}));
}
function goalStats(){
  const p = profile(); if(!p) return null; const goal = Number(p.goal)||10000;
  const series = p.goalPlatform === "all" ? combinedDaily() : dataFor(p.goalPlatform).daily;
  const cur = series.length ? series[series.length-1].v : 0;
  const daysLeft = Math.max(0, Math.ceil((parseYmd(p.goalDate) - parseYmd(today()))/86400000));
  const need = Math.max(0, goal-cur); const perDay = daysLeft ? need/daysLeft : need;
  let pace = null;
  if(series.length >= 2){ const last = series[series.length-1]; const base = series.find(r => r.date >= ymd(addDays(parseYmd(last.date),-28))) || series[0];
    const dd = (parseYmd(last.date)-parseYmd(base.date))/86400000; if(dd>0) pace = (last.v-base.v)/dd; }
  return {goal, cur, daysLeft, need, perDay, pace, projected: pace!=null ? Math.round(cur + pace*daysLeft) : null, series, label: p.goalPlatform==="all" ? "All platforms" : pname(p.goalPlatform)};
}
function cadence(k){
  const d = dataFor(k); if(!d.posts.length) return null;
  const weeks = []; const end = new Date();
  for(let w=0; w<16; w++){
    const to = ymd(addDays(end, -w*7)); const from = ymd(addDays(end, -(w+1)*7));
    const ps = d.posts.filter(x => x.date > from && x.date <= to);
    const a = valueOn(d.daily, from), b = valueOn(d.daily, to); if(a==null||b==null) continue;
    weeks.push({n:ps.length, gain:b-a, reach:avg(ps.map(x=>x.reach))});
  }
  const buckets = {};
  weeks.forEach(w => { const n = Math.min(w.n, 7); if(!n) return; (buckets[n] ||= []).push(w); });
  const rows = Object.entries(buckets).map(([n, ws]) => ({n:Number(n), weeks:ws.length, gain:avg(ws.map(w=>w.gain)), reach:avg(ws.map(w=>w.reach))})).sort((a,b)=>a.n-b.n);
  const good = rows.filter(r => r.weeks >= 1);
  if(!good.length) return null;
  const best = Math.max(...good.map(r=>r.gain));
  const rec = good.find(r => r.gain >= best*.85) || good[good.length-1];
  const top = good.reduce((a,b)=> b.n > a.n ? b : a);
  return {rows:good, rec:rec.n, best, recRow:rec, topRow:top};
}
function formatStats(k){
  const d = dataFor(k); const by = {};
  d.posts.forEach(x => (by[x.format] ||= []).push(x));
  return Object.entries(by).map(([f, ps]) => { const r = sum(ps.map(x=>x.reach));
    return {format:f, n:ps.length, reach:avg(ps.map(x=>x.reach)), er: r ? sum(ps.map(x=>x.likes+x.comments+x.shares+x.saves))/r : 0, saves: r ? sum(ps.map(x=>x.saves))/r : 0, shares: r ? sum(ps.map(x=>x.shares))/r : 0, follows:avg(ps.map(x=>x.follows))}; })
    .sort((a,b)=>b.reach-a.reach);
}
function heat(ks){
  const cells = BLOCKS.map(() => DOW.map(() => []));
  ks.forEach(k => { const d = dataFor(k); const base = avg(d.posts.map(x=>x.reach)) || 1;
    d.posts.forEach(x => { const h = x.hour < 6 ? x.hour+24 : x.hour; const bi = BLOCKS.findIndex(b => h>=b.a && h<b.b); if(bi>=0) cells[bi][x.dow].push(x.reach/base); }); });
  return cells.map(r => r.map(c => c.length ? {v:avg(c), n:c.length} : null));
}
function bestSlot(ks){
  const h = heat(ks); let best = null;
  h.forEach((r,bi) => r.forEach((c,di) => { if(c && c.n >= 2 && (!best || c.v > best.v)) best = {v:c.v, day:DOW[di], block:BLOCKS[bi].n, n:c.n}; }));
  return best;
}
function insights(){
  const out = []; const ks = connected().filter(k => dataFor(k).posts.length);
  ks.forEach(k => {
    const f = formatStats(k);
    if(f.length >= 2){ const a = f[0], b = f[f.length-1]; if(b.reach > 0 && a.reach/b.reach > 1.3) out.push({k, t:`On ${pname(k)}, ${a.format}s reach ${(a.reach/b.reach).toFixed(1)}× more people than ${b.format}s.`, s:`${a.n} ${a.format}s vs ${b.n} ${b.format}s, last ${DAYS} days`});
      const sv = f.slice().sort((x,y)=>y.saves-x.saves)[0]; if(sv && sv.format !== a.format && sv.saves > 0) out.push({k, t:`${sv.format}s get saved the most on ${pname(k)} (${pct(sv.saves,1)} of reach). Saves tell the algorithm people want to come back.`, s:`save rate by format`}); }
    const c = cadence(k);
    if(c && c.topRow.n > c.rec){ const drop = 1 - c.topRow.reach / (c.recRow.reach || 1);
      if(drop > .1) out.push({k, t:`Posting ${c.topRow.n}×/week on ${pname(k)} cut reach per post by ${pct(drop,0)} vs ${c.rec}×/week, without adding followers.`, s:`${c.rows.reduce((a,r)=>a+r.weeks,0)} weeks compared`}); }
  });
  const b = bestSlot(ks); if(b) out.unshift({k:null, t:`Your strongest window is ${b.day} ${b.block.toLowerCase()}: posts there reach ${(b.v).toFixed(1)}× your average.`, s:`${b.n} posts in that window`});
  const viral = ks.flatMap(k => dataFor(k).posts.filter(x=>x.viral).map(x=>({...x}))).sort((a,b)=>b.reach-a.reach)[0];
  if(viral) out.push({k:viral.platform, t:`Your biggest spike was a ${pname(viral.platform)} ${viral.format} on ${fmtDay(viral.date)}: ${fmtK(viral.reach)} reach and +${fmtN(viral.follows)} followers. Bring that footage back with a new angle.`, s:`top post, last ${DAYS} days`});
  return out.slice(0,6);
}
function audienceAll(){
  const ks = connected().filter(k => dataFor(k).audience); if(!ks.length) return null;
  const w = ks.map(k => stats(k).followers); const tw = sum(w) || 1;
  const ages = dataFor(ks[0]).audience.ages.map((a,i) => ({name:a.name, share: sum(ks.map((k,j) => dataFor(k).audience.ages[i].share*w[j]))/tw}));
  const women = sum(ks.map((k,j) => dataFor(k).audience.gender.women*w[j]))/tw;
  const cityMap = {}; ks.forEach((k,j) => dataFor(k).audience.cities.forEach(c => cityMap[c.name] = (cityMap[c.name]||0) + c.share*w[j]/tw));
  const cities = Object.entries(cityMap).map(([name,share])=>({name,share})).sort((a,b)=>b.share-a.share).slice(0,5);
  return {ages, gender:{women, men:1-women-.03, other:.03}, cities};
}
function anyDemo(){ const p = profile(); return !!p && Object.values(p.connections||{}).includes("demo"); }
function metricsBrief(){
  const p = profile(); const lines = [];
  connected().forEach(k => { const s = stats(k); const f = formatStats(k); const c = cadence(k);
    lines.push(`${pname(k)}: ${fmtN(s.followers)} followers, ${s.gain!=null?sgn(s.gain):"?"} in 30d, ${s.posts} posts in 30d, engagement ${pct(s.er)}${f.length?`, formats by avg reach: ${f.map(x=>`${x.format} ${fmtN(x.reach)} reach / ${pct(x.er)} ER / ${pct(x.saves,1)} saves`).join("; ")}`:""}${c?`, weekly follower gain by posts per week: ${c.rows.map(r=>`${r.n}/wk→${sgn(Math.round(r.gain))}`).join(", ")}, best ratio at ${c.rec}/wk`:""}`); });
  const b = bestSlot(connected()); if(b) lines.push(`Best window across platforms: ${b.day} ${b.block}.`);
  const a = audienceAll(); if(a) lines.push(`Audience: ages ${a.ages.map(x=>`${x.name} ${pct(x.share,0)}`).join(", ")}; women ${pct(a.gender.women,0)}; top cities ${a.cities.map(c=>c.name).join(", ")}.`);
  const g = goalStats(); if(g) lines.push(`Goal: ${fmtN(g.goal)} on ${g.label} by ${p.goalDate}; now ${fmtN(g.cur)}; need ${g.perDay.toFixed(1)}/day; current pace ${g.pace!=null?g.pace.toFixed(1):"unknown"}/day.`);
  return lines.join("\n");
}

/* ---------- charts ---------- */
const CHARTS = {};
function lineChart(id, series, opts={}){
  // series: [{key,label,color,points:[{date,v}]}]
  const W = 720, H = opts.h || 260, L = 50, R = 70, T = 14, B = 28;
  const all = series.flatMap(s => s.points); if(!all.length) return `<div class="empty">No data yet.</div>`;
  const dates = [...new Set(all.map(p=>p.date))].sort();
  const x0 = parseYmd(dates[0]).getTime(); const x1 = Math.max(parseYmd(dates[dates.length-1]).getTime(), opts.until ? parseYmd(opts.until).getTime() : 0);
  const span = Math.max(86400000, x1-x0);
  let lo = Math.min(...all.map(p=>p.v)), hi = Math.max(...all.map(p=>p.v), opts.goal||0, opts.projected||0);
  const rng_ = hi-lo || hi || 1; lo = Math.max(0, lo - rng_*.12); hi = hi + rng_*.06;
  const mag = Math.pow(10, Math.floor(Math.log10((hi-lo)/4 || 1))); const step = [1,2,2.5,5,10].map(m=>m*mag).find(s => (hi-lo)/s <= 5) || mag*10;
  lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  const X = t => L + (t-x0)/span*(W-L-R); const Y = v => T + (1-(v-lo)/(hi-lo||1))*(H-T-B);
  let g = "";
  for(let v=lo; v<=hi+1e-9; v+=step) g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-2)" font-family="var(--mono)">${fmtK(v)}</text>`;
  let m = new Date(new Date(x0).getFullYear(), new Date(x0).getMonth()+1, 1);
  while(m.getTime() <= x1){ const xx = X(m.getTime()); g += `<text x="${xx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${m.toLocaleDateString(undefined,{month:"short"})}</text><line x1="${xx}" x2="${xx}" y1="${H-B}" y2="${H-B+4}" stroke="var(--line)"/>`; m = new Date(m.getFullYear(), m.getMonth()+1, 1); }
  g += `<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>`;
  if(opts.goal){ const gy = Y(opts.goal); g += `<line x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}" stroke="var(--ink-2)" stroke-dasharray="4 4"/><text x="${W-R+6}" y="${gy+4}" font-size="11" fill="var(--ink-2)" font-weight="600">Goal ${fmtK(opts.goal)}</text>`; }
  const labels = [];
  series.forEach(s => {
    if(!s.points.length) return;
    const pts = s.points.map(p => [X(parseYmd(p.date).getTime()), Y(p.v)]);
    const d = pts.map((q,i) => (i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
    if(series.length === 1) g += `<path d="${d} L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B} Z" fill="${s.color}" fill-opacity=".1"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.points.length < 20) pts.forEach(q => g += `<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`);
    const last = pts[pts.length-1]; g += `<circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    labels.push({y:last[1], x:last[0], text:`${s.label} ${fmtK(s.points[s.points.length-1].v)}`});
  });
  if(opts.projected!=null && opts.until && series.length===1){
    const s = series[0].points; const lp = s[s.length-1]; g += `<line x1="${X(parseYmd(lp.date).getTime())}" y1="${Y(lp.v)}" x2="${X(parseYmd(opts.until).getTime())}" y2="${Y(opts.projected)}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>`;
    g += `<text x="${X(parseYmd(opts.until).getTime())}" y="${Y(opts.projected)+(opts.projected>opts.goal?-8:16)}" text-anchor="end" font-size="11" fill="var(--ink-2)">at this pace: ${fmtK(opts.projected)}</text>`;
  }
  labels.sort((a,b)=>a.y-b.y); for(let i=1;i<labels.length;i++) if(labels[i].y - labels[i-1].y < 14) labels[i].y = labels[i-1].y + 14;
  if(!opts.until || series.length > 1) labels.forEach(l => g += `<text x="${Math.min(l.x+8, W-R+6)}" y="${l.y+4}" font-size="11" fill="var(--ink)" font-weight="600">${esc(l.text)}</text>`);
  CHARTS[id] = {series, X, Y, x0, span, L, R, W, H, T, B, dates};
  return `<div class="chart-wrap" data-chart="${id}"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||"Followers over time")}">${g}<line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--ink-2)" stroke-width="1" visibility="hidden"/><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" class="hit"/></svg><div class="tip" hidden></div></div>`;
}
document.addEventListener("pointermove", e => {
  const wrap = e.target.closest?.(".chart-wrap"); document.querySelectorAll(".chart-wrap").forEach(w => { if(w !== wrap){ const t = w.querySelector(".tip"); if(t) t.hidden = true; const xh = w.querySelector(".xh"); if(xh) xh.setAttribute("visibility","hidden"); } });
  if(!wrap) return; const c = CHARTS[wrap.dataset.chart]; if(!c) return;
  const svg = wrap.querySelector("svg"); const r = svg.getBoundingClientRect(); const sx = (e.clientX - r.left) * c.W / r.width;
  if(sx < c.L || sx > c.W - c.R) return;
  const t = c.x0 + (sx - c.L)/(c.W-c.L-c.R)*c.span;
  let best = null; for(const d of c.dates){ const dt = Math.abs(parseYmd(d).getTime() - t); if(!best || dt < best.dt) best = {d, dt}; }
  if(!best) return; const xx = c.X(parseYmd(best.d).getTime());
  const xh = wrap.querySelector(".xh"); xh.setAttribute("x1", xx); xh.setAttribute("x2", xx); xh.setAttribute("visibility","visible");
  const rows = c.series.map(s => { const v = valueOn(s.points, best.d); return v==null ? "" : `<div><span class="dot" style="background:${s.color}"></span> ${esc(s.label)} <span class="mono">${fmtN(v)}</span></div>`; }).join("");
  const tip = wrap.querySelector(".tip"); tip.innerHTML = `<div style="opacity:.75">${fmtDay(best.d)}</div>${rows}`; tip.hidden = false;
  const px = xx / c.W * r.width; tip.style.left = Math.max(70, Math.min(r.width-70, px)) + "px"; tip.style.top = (c.T / c.H * r.height + 4) + "px";
});
function hbars(rows, opts={}){
  const max = Math.max(...rows.map(r=>r.v), 1e-9);
  return `<div class="hbar">${rows.map(r => `<span>${r.label}</span><div class="t" title="${esc(r.title||"")}"><i class="${r.rec?"rec":""}" style="width:${Math.max(2, r.v/max*100).toFixed(1)}%"></i></div><span class="mono small">${r.text}</span>`).join("")}</div>`;
}
function heatmap(ks){
  const h = heat(ks); const vals = h.flat().filter(Boolean).map(c=>c.v); if(!vals.length) return `<div class="empty">Needs post data.</div>`;
  const mn = Math.min(...vals), mx = Math.max(...vals);
  const color = v => { const i = Math.min(5, Math.floor((v-mn)/((mx-mn)||1)*5.999)); return `var(--seq-${i+1})`; };
  return `<div class="heat"><span></span>${DOW.map(d=>`<span class="dh">${d}</span>`).join("")}
    ${h.map((r,bi) => `<span class="h">${BLOCKS[bi].n}</span>${r.map((c,di) => c ? `<div class="c" style="background:${color(c.v)}" title="${DOW[di]} ${BLOCKS[bi].n}: ${c.v.toFixed(2)}× average reach (${c.n} posts)"></div>` : `<div class="c" style="background:var(--sunk);opacity:.5" title="No posts"></div>`).join("")}`).join("")}</div>
    <div class="legend" style="margin-top:8px"><span>Lower reach</span>${[1,2,3,4,5,6].map(i=>`<span class="dot" style="background:var(--seq-${i});border-radius:2px;width:16px"></span>`).join("")}<span>Higher reach</span></div>`;
}

/* ---------- Dashboard ---------- */
function deltaHtml(cur, prev, f = sgn, isPct){ if(prev==null || cur==null) return `<span class="d muted">—</span>`; const d = cur - prev; const cls = d >= 0 ? "up" : "down"; return `<span class="d ${cls}">${d>=0?"▲":"▼"} ${isPct ? (Math.abs(d)*100).toFixed(1)+" pts" : f(d).replace(/^[+−]/,"")} vs prior 30d</span>`; }
function vDash(){
  const p = profile(); const g = goalStats(); const ks = connected();
  const ss = ks.map(k => stats(k));
  const tot = sum(ss.map(s=>s.followers)); const gain = sum(ss.map(s=>s.gain||0)); const gainPrev = ss.every(s=>s.gainPrev!=null) ? sum(ss.map(s=>s.gainPrev)) : null;
  const reach = sum(ss.map(s=>s.reach)), reachPrev = sum(ss.map(s=>s.reachPrev));

  return x.status;
}

const BLOCK_TIME = {Morning:"09:00", Midday:"12:30", Afternoon:"16:00", Evening:"19:00", Late:"22:30"};
function bestTimeFor(k){ const b = profile()?.connections?.[k] ? bestSlot([k]) : null; return b ? BLOCK_TIME[b.block] : null; }
function mapFormat(fmt, k){
  const kind = /Reel|Video|Short/.test(fmt||"") ? "video" : /Carousel|Photo|Image/.test(fmt||"") ? "image" : /Thread/.test(fmt||"") ? "thread" : "text";
  const pick = {video:{ig:"Reel",tt:"Video",yt:"Short",th:"Text",x:"Video",fb:"Reel"}, image:{ig:"Carousel",tt:"Photo carousel",yt:"Short",th:"Photo",x:"Image",fb:"Photo"},
    thread:{ig:"Carousel",tt:"Video",yt:"Short",th:"Text",x:"Thread",fb:"Photo"}, text:{ig:"Photo",tt:"Video",yt:"Short",th:"Text",x:"Text",fb:"Photo"}};
  return pick[kind][k] || (FORMATS[k]||[""])[0];
}

function vQueue(){
  const all = posts(); const t = today();
  const f = UI.qFilter;
  const list = all.filter(x => { const st = effStatus(x); return f==="open" ? st!=="published" : f==="all" ? true : st===f; });
  const groups = {}; list.forEach(x => (groups[x.date||"No date"] ||= []).push(x));

function kitData(){

  const eng = ss.filter(s=>s.reach); const er = eng.length ? sum(eng.map(s=>s.er*s.reach))/sum(eng.map(s=>s.reach)) : null;
  const d90 = ss.map(s => { const d = s.data.daily; const then = valueOn(d, ymd(addDays(new Date(),-90))); return then!=null ? s.followers-then : 0; });
  const g90 = sum(d90); const base = tot - g90;
  const top = ks.flatMap(k => dataFor(k).posts).sort((a,b)=>b.reach-a.reach).slice(0,3).map(x => ({platform:x.platform, format:x.format, date:x.date, reach:x.reach, engagement:x.likes+x.comments+x.shares+x.saves}));

function aiErr(e){ const c = e?.code;
  if(c==="not_granted") return "Claude isn't allowed on this page yet. Allow it in the page's permissions and try again.";
  if(c==="rate_limited") return "Too many requests at once. Wait a minute and try again.";
  if(c==="invalid_json") return "The answer came back incomplete. Try again.";
  if(c==="daily_limit") return "You've used today's Claude requests. They reset tomorrow.";
  if(c==="signed_out") return "Your sign-in expired. Sign in again to use suggestions.";
  if(c==="refused") return "Claude couldn't help with that one. Try rewording the notes.";
  if(c==="image_too_big") return "That image is too large. Use a screenshot under 4 MB.";
  return "Couldn't reach Claude. Try again in a moment."; }

    `Monthly reach: ${fmtN(k.reach30)}`, k.er!=null?`Engagement rate: ${pct(k.er)}`:"", k.growth90!=null?`90-day growth: +${pct(k.growth90,0)}`:""];

async function aiCall(prompt, opts={}){
  const images = [];
  for(const f of [].concat(opts.images || [])){
    if(f.size > 4.5*1024*1024) throw {code:"image_too_big"};
    images.push({media_type: f.type || "image/jpeg", data: await blobToB64(f)});
  }
  const { data, error } = await S.sb.functions.invoke("rollout-ai", { body:{ prompt, tier: opts.modelTier || "default", images } });
  if(error){
    const status = error.context?.status; let body = null; try{ body = await error.context.json(); }catch{}
    throw {code: body?.code || (status===429 ? "rate_limited" : status===401 ? "signed_out" : "unavailable")};
  }
  return data?.result;
}

/* ---------- accounts and encryption (connected mode) ----------
   Each workspace is encrypted in the browser with its own random key (AES-256-GCM) before it's saved.
   That key is stored only in wrapped form: once under a key made from the password, once under a key made
   from a recovery code (PBKDF2-SHA-256, 600,000 rounds). The server never sees the password either: sign-in
   uses a separate value derived from it, so the database holds nothing that can unlock a workspace. */
const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => { const b = new Uint8Array(buf); let s = ""; for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode(...b.subarray(i,i+0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KDF_ROUNDS = 600000;
async function pbkdf2(secret, salt){ const base = await crypto.subtle.importKey("raw", te.encode(secret), "PBKDF2", false, ["deriveBits"]); return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt, iterations:KDF_ROUNDS}, base, 256)); }
const aesKey = raw => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt","decrypt"]);
async function seal(key, bytes){ const iv = crypto.getRandomValues(new Uint8Array(12)); return {iv:b64(iv), ct:b64(await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, bytes))}; }
async function unseal(key, box){ return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(box.iv)}, key, unb64(box.ct))); }
const newSalt = () => b64(crypto.getRandomValues(new Uint8Array(16)));
const kekFrom = async (secret, salt) => aesKey(await pbkdf2(secret, unb64(salt)));
const authPassword = async (email, pw) => "rr1." + b64(await pbkdf2(pw, te.encode("rollout-room/auth/" + email.trim().toLowerCase())));
const normCode = c => String(c||"").toUpperCase().replace(/[^A-Z0-9]/g, "");
function newRecoveryCode(){ const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; return [...crypto.getRandomValues(new Uint8Array(24))].map(b => A[b % 32]).join("").match(/.{4}/g).join("-"); }

// A device that chose "stay unlocked" keeps the workspace key in IndexedDB as a non-exportable key.
function idb(mode, fn){ return new Promise((res, rej) => { const r = indexedDB.open("rollout-room", 1); r.onupgradeneeded = () => r.result.createObjectStore("keys");
  r.onerror = () => rej(r.error); r.onsuccess = () => { const tx = r.result.transaction("keys", mode); const q = fn(tx.objectStore("keys")); tx.oncomplete = () => res(q?.result); tx.onerror = () => rej(tx.error); }; }); }
const deviceKeys = { get: uid => idb("readonly", s => s.get(uid)).catch(() => null), put: (uid, k) => idb("readwrite", s => s.put(k, uid)).catch(() => {}), del: uid => idb("readwrite", s => s.delete(uid)).catch(() => {}) };

async function keyRow(){ const { data, error } = await S.sb.from("rollout_keys").select("*").eq("user_id", S.uid).maybeSingle(); if(error) throw error; return data; }
async function createKeys(password){
  const raw = crypto.getRandomValues(new Uint8Array(32)); const code = newRecoveryCode(); const pwSalt = newSalt(), rcSalt = newSalt();
  const row = { user_id:S.uid, pw_salt:pwSalt, pw_box: await seal(await kekFrom(password, pwSalt), raw), rc_salt:rcSalt, rc_box: await seal(await kekFrom(normCode(code), rcSalt), raw) };
  const { error } = await S.sb.from("rollout_keys").upsert(row); if(error) throw error;
  return { key: await aesKey(raw), code };
}
async function rewrapPassword(raw, password){
  const pwSalt = newSalt(); const { error } = await S.sb.from("rollout_keys").update({ pw_salt:pwSalt, pw_box: await seal(await kekFrom(password, pwSalt), raw) }).eq("user_id", S.uid); if(error) throw error;
}
async function useKey(key, remember){ S.key = key; if(remember) await deviceKeys.put(S.uid, key); else await deviceKeys.del(S.uid); }

async function loadWorkspace(){
  const sb = S.sb, uid = S.uid, key = S.key;
  const { data, error } = await sb.from("rollout_docs").select("id,data").limit(5000);
  if(error){ toast("Couldn't load your workspace. Refresh to try again."); return false; }
  const docs = new Map(); let bad = 0;
  for(const r of data){ try{ docs.set(r.id, JSON.parse(td.decode(await unseal(key, r.data)))); }catch{ bad++; } }
  if(data.length && bad === data.length) return false;
  if(bad) toast(`${bad} item${bad===1?"":"s"} couldn't be unlocked.`);
  S.docs = docs; S.mode = "cloud";
  S.col = { doc: id => ({
    set: async d => { const box = await seal(key, te.encode(JSON.stringify(d))); const { error } = await sb.from("rollout_docs").upsert({ user_id: uid, id, data: box, updated_at: new Date().toISOString() }); if(error) throw {code:"unavailable"}; },
    delete: async () => { const { error } = await sb.from("rollout_docs").delete().eq("user_id", uid).eq("id", id); if(error) throw {code:"unavailable"}; }
  }) };
  S.kits = {
    save: async d => { const { error } = await sb.from("media_kits").upsert({ user_id: uid, code: d.code, data: d, updated_at: new Date().toISOString() }); if(error) throw {code:"unavailable"}; },
    remove: async () => { await sb.from("media_kits").delete().eq("user_id", uid); }
  };
  S.sample = { json: aiCall, limits: async () => ({ images:{ maxCount:3, mediaTypes:["image/jpeg","image/png","image/webp","image/gif"] } }) };
  S.canImg = true; $("#imgPick").accept = "image/jpeg,image/png,image/webp,image/gif";
  S.ready = true; UI.auth = null; UI.authErr = null;
  if(!S.docs.get("profile")?.onboarded && !UI.wiz && !S.sampleMode) startWizard();
  render(true); return true;
}
async function unlockWith(password, remember){
  const row = await keyRow();
  if(!row){ const { key, code } = await createKeys(password); await useKey(key, remember); await loadWorkspace(); UI.rc = code; UI.auth = "recovery-show"; render(); return; }
  let raw; try{ raw = await unseal(await kekFrom(password, row.pw_salt), row.pw_box); }catch{ UI.auth = "unlock"; UI.authErr = "That password doesn't unlock this workspace."; render(); return; }
  await useKey(await aesKey(raw), remember);
  if(!(await loadWorkspace())){ UI.auth = "unlock"; UI.authErr = "This workspace couldn't be unlocked."; render(); }
}
function clearSession(){ S.uid = null; S.key = null; S.me = null; S.docs = new Map(); S.mode = "local"; S.sample = null; S.kits = null; S.col = null; S.canImg = false; }

async function onAuth(event, session){
  if(event === "PASSWORD_RECOVERY"){ S.uid = session.user.id; S.me = {name:"", email:session.user.email}; UI.auth = "reset"; UI.authErr = null; S.ready = true; render(); return; }
  const uid = session?.user?.id || null;
  if(!uid){ clearSession(); if(!["signup","signin","confirm","forgot","forgotSent"].includes(UI.auth)) UI.auth = null; S.ready = true; render(true); return; }
  if(S.busyAuth || (uid === S.uid && S.key) || UI.auth === "reset" || UI.auth === "reset-fresh") return;
  S.uid = uid; S.me = {name:"", email:session.user.email};
  const stored = await deviceKeys.get(uid);
  if(stored){ S.key = stored; if(await loadWorkspace()) return; S.key = null; await deviceKeys.del(uid); }
  UI.auth = "unlock"; S.ready = true; render();
}

async function bootSupabase(){
  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
  S.sb = sb;
  if(hashKit){ const { data, error } = await sb.rpc("get_media_kit", { kit_code: hashKit }); UI.kitView = !error && data ? data : "missing"; render(); }
  sb.auth.onAuthStateChange((event, session) => { setTimeout(() => onAuth(event, session).catch(() => { S.ready = true; toast("Something went wrong. Refresh to try again."); render(); }), 0); });
}

// Runs an account action with the form locked and errors shown on the form.
async function authStep(fn){
  UI.busy.auth = true; UI.authErr = null; S.busyAuth = true; render(true);
  try{ await fn(); }catch(e){ UI.authErr = e?.userMessage || "Something went wrong. Check your connection and try again."; }
  S.busyAuth = false; UI.busy.auth = false; render(true);
}
const fail = msg => { throw {userMessage: msg}; };
const authVal = id => document.getElementById(id)?.value ?? "";
function newPasswordPair(){ const pw = authVal("au_pw"), pw2 = authVal("au_pw2"); if(pw.length < 10) fail("Use at least 10 characters."); if(pw !== pw2) fail("The two passwords don't match."); return pw; }
const siteUrl = () => location.origin + location.pathname;

if(MODE !== "supabase") loadLocal();
S.ready = MODE === "local";
setTimeout(() => { if(!S.ready){ S.ready = true; render(); } }, 8000);
render();
if(MODE === "claude") bootClaude();
else if(MODE === "supabase") bootSupabase().catch(() => { S.ready = true; toast("Couldn't reach the server. Refresh to try again."); render(); });
else if(hashKit){ UI.kitView = "missing"; render(); }
})();
</script>
